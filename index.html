<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surprise 🎂</title>
<style>
  :root {
    --bg: #fdf0f5;
    --card: #ffffff;
    --text: #2b2230;
    --accent: #ff4d8d;
    --accent2: #ffb648;
    --muted: #8a7a8c;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1620;
      --card: #2a2130;
      --text: #f6eef5;
      --muted: #bba9bd;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1620;
    --card: #2a2130;
    --text: #f6eef5;
    --muted: #bba9bd;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 24px;
    overflow-x: hidden;
  }
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 32px 24px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 8px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.95rem;
  }
  button {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    border-radius: 999px;
    padding: 16px 28px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: transform 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.6; }

  video, canvas, img.shot {
    width: 100%;
    max-width: 100%;
    border-radius: 16px;
    display: block;
    margin: 0 auto;
    transform: scaleX(-1);
  }
  .hidden { display: none !important; }

  .countdown {
    font-size: 3rem;
    font-weight: 800;
    color: var(--accent);
    margin: 12px 0;
  }

  .result-title {
    font-size: 1.6rem;
    font-weight: 800;
    margin: 16px 0 4px;
    line-height: 1.3;
  }
  .result-sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 4px;
  }

  .error {
    color: var(--accent);
    font-size: 0.9rem;
    margin-top: 12px;
  }

  #confetti-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="card" id="card">
  <div id="step-intro">
    <h1>🎁 Tu as reçu une surprise</h1>
    <p class="sub">Clique sur le bouton pour la découvrir...</p>
    <button id="startBtn">Clique ici 👀</button>
    <div class="error hidden" id="errorMsg"></div>
  </div>

  <div id="step-camera" class="hidden">
    <video id="video" autoplay playsinline muted></video>
    <div class="countdown" id="countdownNum"></div>
  </div>

  <div id="step-result" class="hidden">
    <img id="photo" class="shot" alt="Ta photo surprise">
    <div class="result-title">🎉 Joyeux anniversaire<br>my best friend ! 🎂🥳</div>
    <div class="result-sub">Regarde cette tête 😂❤️</div>
    <button id="sendBtn" style="margin-top:16px;">Envoie-moi ta tête 😂</button>
    <button id="downloadBtn" style="margin-top:10px; background: transparent; color: var(--accent); border: 2px solid var(--accent);">Télécharger la photo</button>
    <div class="result-sub" id="shareHint" style="margin-top:10px;"></div>
  </div>
</div>

<canvas id="captureCanvas" class="hidden"></canvas>

<script>
const startBtn = document.getElementById('startBtn');
const stepIntro = document.getElementById('step-intro');
const stepCamera = document.getElementById('step-camera');
const stepResult = document.getElementById('step-result');
const video = document.getElementById('video');
const countdownNum = document.getElementById('countdownNum');
const errorMsg = document.getElementById('errorMsg');
const photoImg = document.getElementById('photo');
const captureCanvas = document.getElementById('captureCanvas');

let stream = null;

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  errorMsg.classList.add('hidden');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
    video.srcObject = stream;
    stepIntro.classList.add('hidden');
    stepCamera.classList.remove('hidden');

    let count = 3;
    countdownNum.textContent = count;
    const timer = setInterval(() => {
      count--;
      if (count > 0) {
        countdownNum.textContent = count;
      } else {
        clearInterval(timer);
        takePhoto();
      }
    }, 1000);
  } catch (err) {
    startBtn.disabled = false;
    errorMsg.textContent = "Oups, impossible d'accéder à la caméra. Autorise l'accès puis réessaie 📸";
    errorMsg.classList.remove('hidden');
  }
});

function takePhoto() {
  const w = video.videoWidth || 640;
  const h = video.videoHeight || 480;
  captureCanvas.width = w;
  captureCanvas.height = h;
  const ctx = captureCanvas.getContext('2d');
  // mirror to match the on-screen preview
  ctx.translate(w, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, w, h);

  photoImg.src = captureCanvas.toDataURL('image/png');

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }

  stepCamera.classList.add('hidden');
  stepResult.classList.remove('hidden');
  launchConfetti();
}

const sendBtn = document.getElementById('sendBtn');
const downloadBtn = document.getElementById('downloadBtn');
const shareHint = document.getElementById('shareHint');

function dataURLtoFile(dataUrl, filename) {
  const arr = dataUrl.split(',');
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) { u8arr[n] = bstr.charCodeAt(n); }
  return new File([u8arr], filename, { type: mime });
}

sendBtn.addEventListener('click', async () => {
  const file = dataURLtoFile(photoImg.src, 'surprise-anniversaire.png');
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({
        files: [file],
        title: 'Ma photo surprise',
        text: 'Voici ma tête pour la blague d\'anniversaire 😂'
      });
      shareHint.textContent = 'Envoyé 👍';
      return;
    } catch (e) {
      // user cancelled or share failed, fall through to download
    }
  }
  shareHint.textContent = "Le partage direct n'est pas dispo ici : la photo a été téléchargée, envoie-la toi-même 📎";
  triggerDownload();
});

downloadBtn.addEventListener('click', triggerDownload);

function triggerDownload() {
  const a = document.createElement('a');
  a.href = photoImg.src;
  a.download = 'surprise-anniversaire.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// --- Confetti ---
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const colors = ['#ff4d8d', '#ffb648', '#6ee7b7', '#60a5fa', '#c084fc'];
  const pieces = Array.from({ length: 150 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height,
    r: 4 + Math.random() * 6,
    speed: 2 + Math.random() * 4,
    drift: (Math.random() - 0.5) * 2,
    color: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * 360,
    rotSpeed: (Math.random() - 0.5) * 10
  }));

  let frame = 0;
  const maxFrames = 420;

  function draw() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.y += p.speed;
      p.x += p.drift;
      p.rot += p.rotSpeed;
      if (p.y > canvas.height + 20) {
        p.y = -20;
        p.x = Math.random() * canvas.width;
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rot * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 0.6);
      ctx.restore();
    });
    if (frame < maxFrames) {
      requestAnimationFrame(draw);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  draw();
}
</script>

</body>
</html>
